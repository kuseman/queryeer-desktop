name: Create Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version component to increment
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major
          - patch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  create-release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: queryeer-desktop/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: zulu
          cache: maven

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Compute release and next backend snapshot versions
        id: versions
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          INCREMENT="${{ github.event.inputs.increment }}"

          if [ -n "$LATEST_TAG" ]; then
            STRIPPED="${LATEST_TAG#v}"
            MAJOR=$(echo "$STRIPPED" | cut -d. -f1)
            MINOR=$(echo "$STRIPPED" | cut -d. -f2)
            PATCH=$(echo "$STRIPPED" | cut -d. -f3)
          else
            MAJOR=0; MINOR=1; PATCH=0
          fi

          case "$INCREMENT" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              NEXT_SNAPSHOT="$((MAJOR + 1)).1.0-SNAPSHOT"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              NEXT_SNAPSHOT="${MAJOR}.${MINOR}.$((PATCH + 2))-SNAPSHOT"
              ;;
            *)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              NEXT_SNAPSHOT="${MAJOR}.$((MINOR + 2)).0-SNAPSHOT"
              ;;
          esac

          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "NEXT_SNAPSHOT=${NEXT_SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${NEW_VERSION}, next backend snapshot: ${NEXT_SNAPSHOT}"

      - name: Install dependencies
        working-directory: queryeer-desktop
        run: npm ci

      - name: Set desktop release version
        working-directory: queryeer-desktop
        run: |
          npm version -w @queryeer/app ${{ steps.versions.outputs.NEW_VERSION }} --no-git-tag-version --allow-same-version
          npm version -w @queryeer/api ${{ steps.versions.outputs.NEW_VERSION }} --no-git-tag-version --allow-same-version

      - name: Make Maven wrapper executable
        run: chmod +x ./queryeer-backend/mvnw

      - name: Set backend release version
        run: ./queryeer-backend/mvnw -B -f queryeer-backend/pom.xml versions:set -DnewVersion=${{ steps.versions.outputs.NEW_VERSION }} -DgenerateBackupPoms=false

      - name: Commit and tag release
        run: |
          git add queryeer-desktop/package.json queryeer-desktop/package-lock.json queryeer-desktop/packages/app/package.json queryeer-desktop/packages/api/package.json queryeer-backend
          git commit -m "release: v${{ steps.versions.outputs.NEW_VERSION }}"
          git tag v${{ steps.versions.outputs.NEW_VERSION }}

      - name: Set backend next snapshot version
        run: ./queryeer-backend/mvnw -B -f queryeer-backend/pom.xml versions:set -DnewVersion=${{ steps.versions.outputs.NEXT_SNAPSHOT }} -DgenerateBackupPoms=false

      - name: Update example plugin POMs to next snapshot
        shell: bash
        run: |
          sed -i "s|<queryeer.version>[0-9.]\\+-SNAPSHOT</queryeer.version>|<queryeer.version>${{ steps.versions.outputs.NEXT_SNAPSHOT }}</queryeer.version>|g" \
            plugins-examples/jdbc-dialect/backend/pom.xml \
            plugins-examples/payloadbuilder-catalog/backend/pom.xml

      - name: Commit next backend snapshot
        run: |
          git add queryeer-backend
          git add plugins-examples
          git commit -m "chore: prepare for next development iteration"

      - name: Push commits and release tag
        run: |
          git push
          git push origin v${{ steps.versions.outputs.NEW_VERSION }}
