name: Create Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version component to increment
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major
          - patch

jobs:
  create-release:
    name: Create Release Tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: queryeer-desktop/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25.0.5+0.3.1"
          distribution: zulu
          cache: maven

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Compute release and next backend snapshot versions
        id: versions
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          INCREMENT="${{ github.event.inputs.increment }}"

          if [ -n "$LATEST_TAG" ]; then
            STRIPPED="${LATEST_TAG#v}"
            MAJOR=$(echo "$STRIPPED" | cut -d. -f1)
            MINOR=$(echo "$STRIPPED" | cut -d. -f2)
            PATCH=$(echo "$STRIPPED" | cut -d. -f3)
          else
            MAJOR=0; MINOR=1; PATCH=0
          fi

          case "$INCREMENT" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              NEXT_SNAPSHOT="$((MAJOR + 1)).1.0-SNAPSHOT"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              NEXT_SNAPSHOT="${MAJOR}.${MINOR}.$((PATCH + 2))-SNAPSHOT"
              ;;
            *)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              NEXT_SNAPSHOT="${MAJOR}.$((MINOR + 2)).0-SNAPSHOT"
              ;;
          esac

          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "NEXT_SNAPSHOT=${NEXT_SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${NEW_VERSION}, next backend snapshot: ${NEXT_SNAPSHOT}"

      - name: Install dependencies
        working-directory: queryeer-desktop
        run: npm ci

      - name: Set desktop release version
        working-directory: queryeer-desktop
        run: |
          npm version -w @queryeer/app ${{ steps.versions.outputs.NEW_VERSION }} --no-git-tag-version --allow-same-version
          npm version -w @queryeer/api ${{ steps.versions.outputs.NEW_VERSION }} --no-git-tag-version --allow-same-version

      - name: Update @queryeer/api ranges in examples and plugin guide
        shell: bash
        run: |
          NEW_RANGE="^${{ steps.versions.outputs.NEW_VERSION }}"
          # Example plugins list @queryeer/api twice (peerDependencies and devDependencies); the
          # plugin guide's JSON snippets use the same range for the dependency and the manifest apiVersion.
          FILES=(plugins-examples/*/package.json DEVELOPMENT-PLUGIN.md)
          KEY='"(@queryeer/api|apiVersion)": "'
          EXPECTED=$(cat "${FILES[@]}" | grep -cE "${KEY}[~^]?[0-9]+\.[0-9]+\.[0-9]+\"")
          sed -i -E "s#(${KEY})\^[0-9]+\.[0-9]+\.[0-9]+\"#\1${NEW_RANGE}\"#g" "${FILES[@]}"
          UPDATED=$(cat "${FILES[@]}" | grep -cF -e "\"@queryeer/api\": \"${NEW_RANGE}\"" -e "\"apiVersion\": \"${NEW_RANGE}\"")
          if [ "${EXPECTED}" -eq 0 ] || [ "${UPDATED}" -ne "${EXPECTED}" ]; then
            grep -nE "${KEY}" "${FILES[@]}" || true
            echo "::error::Expected ${EXPECTED} @queryeer/api ranges to become ${NEW_RANGE}, found ${UPDATED}"
            exit 1
          fi

      - name: Make Maven wrapper executable
        run: chmod +x ./queryeer-backend/mvnw

      - name: Set backend release version
        run: ./queryeer-backend/mvnw -B -f queryeer-backend/pom.xml versions:set -DnewVersion=${{ steps.versions.outputs.NEW_VERSION }} -DgenerateBackupPoms=false

      - name: Set SCM tag to release version
        shell: bash
        run: |
          sed -i "s|<tag>HEAD</tag>|<tag>v${{ steps.versions.outputs.NEW_VERSION }}</tag>|" queryeer-backend/pom.xml

      - name: Commit and tag release
        run: |
          git add queryeer-desktop/package.json queryeer-desktop/package-lock.json queryeer-desktop/packages/app/package.json queryeer-desktop/packages/api/package.json queryeer-backend plugins-examples DEVELOPMENT-PLUGIN.md
          git commit -m "release: v${{ steps.versions.outputs.NEW_VERSION }}"
          git tag v${{ steps.versions.outputs.NEW_VERSION }}

      - name: Set backend next snapshot version
        run: ./queryeer-backend/mvnw -B -f queryeer-backend/pom.xml versions:set -DnewVersion=${{ steps.versions.outputs.NEXT_SNAPSHOT }} -DgenerateBackupPoms=false

      - name: Update example plugin POMs to next snapshot
        shell: bash
        run: |
          sed -i "s|<queryeer.version>[0-9.]\\+-SNAPSHOT</queryeer.version>|<queryeer.version>${{ steps.versions.outputs.NEXT_SNAPSHOT }}</queryeer.version>|g" \
            plugins-examples/jdbc-dialect/backend/pom.xml \
            plugins-examples/payloadbuilder-catalog/backend/pom.xml

      - name: Reset SCM tag back to HEAD
        shell: bash
        run: |
          sed -i "s|<tag>v${{ steps.versions.outputs.NEW_VERSION }}</tag>|<tag>HEAD</tag>|" queryeer-backend/pom.xml

      - name: Commit next backend snapshot
        run: |
          git add queryeer-backend
          git add plugins-examples
          git commit -m "chore: prepare for next development iteration"

      - name: Push commits and release tag
        run: |
          git push
          git push origin v${{ steps.versions.outputs.NEW_VERSION }}
