name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run release validation without creating a GitHub Release
        required: true
        default: true
        type: boolean
      release_version:
        description: Optional version to validate against. Defaults to the package/project version for dry runs.
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  backend-verify:
    name: Backend Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refuse manual publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo "Manual release workflow runs must use dry_run=true."
          echo "Push a v* tag to run the real release publish path."
          exit 1

      - name: Set up JDK 25 (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: zulu
          cache: maven

      - name: Set up JDK 25 (publish)
        if: github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: zulu
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./queryeer-backend/mvnw

      - name: Run backend clean verify
        run: ./queryeer-backend/mvnw -f queryeer-backend/pom.xml clean verify

  build:
    name: Build ${{ matrix.name }} Distribution
    runs-on: ${{ matrix.os }}
    needs: backend-verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact-name: queryeer-windows
          - name: macOS
            os: macos-latest
            artifact-name: queryeer-macos
          - name: Linux
            os: ubuntu-latest
            artifact-name: queryeer-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="${{ inputs.release_version }}"
            if [ -z "$RELEASE_VERSION" ]; then
              RELEASE_VERSION=$(node -p "require('./queryeer-desktop/packages/app/package.json').version")
            fi
          fi
          echo "QUERYEER_RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Validate desktop package versions
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./queryeer-desktop/packages/app/package.json').version")
          API_VERSION=$(node -p "require('./queryeer-desktop/packages/api/package.json').version")
          if [ "$APP_VERSION" != "$QUERYEER_RELEASE_VERSION" ]; then
            echo "Desktop app package version $APP_VERSION does not match release version $QUERYEER_RELEASE_VERSION."
            echo "Run the Create Release workflow so the version bump is committed before tagging."
            exit 1
          fi
          if [ "$API_VERSION" != "$QUERYEER_RELEASE_VERSION" ]; then
            echo "Desktop API package version $API_VERSION does not match release version $QUERYEER_RELEASE_VERSION."
            echo "Run the Create Release workflow so the version bump is committed before tagging."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: queryeer-desktop/package-lock.json

      - name: Setup Electron (cache)
        uses: ./.github/actions/setup-electron
        with:
          mode: cache

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: zulu
          cache: maven

      - name: Make Maven wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./queryeer-backend/mvnw

      - name: Install desktop dependencies
        working-directory: queryeer-desktop
        run: npm ci --no-audit --no-fund

      - name: Setup Electron (ensure)
        uses: ./.github/actions/setup-electron
        with:
          mode: ensure

      - name: Run desktop typecheck
        working-directory: queryeer-desktop
        run: npm run typecheck

      - name: Run desktop lint
        working-directory: queryeer-desktop
        run: npm run lint

      - name: Run desktop tests
        working-directory: queryeer-desktop
        run: npm run test

      - name: Build distribution
        working-directory: queryeer-desktop
        run: npm run dist:release

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            queryeer-desktop/packages/app/release/*.exe
            queryeer-desktop/packages/app/release/*.dmg
            queryeer-desktop/packages/app/release/*.AppImage
            !queryeer-desktop/packages/app/release/*-unpacked/**
          if-no-files-found: error

  publish-maven-central:
    name: Publish Maven Central
    runs-on: ubuntu-latest
    needs: backend-verify
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25 (publish)
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: zulu
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        env:
          MAVEN_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}

      - name: Make Maven wrapper executable
        run: chmod +x ./queryeer-backend/mvnw

      - name: Set release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="${{ inputs.release_version }}"
            if [ -z "$RELEASE_VERSION" ]; then
              RELEASE_VERSION=$(./queryeer-backend/mvnw -q -f queryeer-backend/pom.xml -DforceStdout help:evaluate -Dexpression=project.version)
            fi
          fi
          echo "QUERYEER_RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Validate backend version
        shell: bash
        run: |
          BACKEND_VERSION=$(./queryeer-backend/mvnw -q -f queryeer-backend/pom.xml -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "$BACKEND_VERSION" != "$QUERYEER_RELEASE_VERSION" ]; then
            echo "Backend version $BACKEND_VERSION does not match release version $QUERYEER_RELEASE_VERSION."
            echo "Run the Create Release workflow so the version bump is committed before tagging."
            exit 1
          fi

      - name: Dry-run Maven Central publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: ./queryeer-backend/mvnw -B -f queryeer-backend/pom.xml clean deploy -DperformRelease=true -DskipTests=true -Dmaven.test.skip=true -DskipPublishing=true
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish backend artifacts to Maven Central
        if: github.event_name == 'push'
        run: ./queryeer-backend/mvnw -B -f queryeer-backend/pom.xml clean deploy -DperformRelease=true -DskipTests=true -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-npm:
    name: Publish npm Package
    runs-on: ubuntu-latest
    needs: backend-verify
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: queryeer-desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: queryeer-desktop
        run: npm ci --no-audit --no-fund

      - name: Set release version
        working-directory: queryeer-desktop
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="${{ inputs.release_version }}"
            if [ -z "$RELEASE_VERSION" ]; then
              RELEASE_VERSION=$(node -p "require('./packages/api/package.json').version")
            fi
          fi
          echo "QUERYEER_RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Validate npm package version
        working-directory: queryeer-desktop
        shell: bash
        run: |
          API_VERSION=$(node -p "require('./packages/api/package.json').version")
          if [ "$API_VERSION" != "$QUERYEER_RELEASE_VERSION" ]; then
            echo "Desktop API package version $API_VERSION does not match release version $QUERYEER_RELEASE_VERSION."
            echo "Run the Create Release workflow so the version bump is committed before tagging."
            exit 1
          fi

      - name: Build npm package
        working-directory: queryeer-desktop
        run: npm run -w @queryeer/api build

      - name: Dry-run npm package publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        working-directory: queryeer-desktop
        run: npm pack -w @queryeer/api --dry-run

      - name: Publish npm package
        if: github.event_name == 'push'
        working-directory: queryeer-desktop
        run: npm publish -w @queryeer/api --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - publish-maven-central
      - publish-npm
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="${{ inputs.release_version }}"
            if [ -z "$RELEASE_VERSION" ]; then
              RELEASE_VERSION=$(node -p "require('./queryeer-desktop/packages/app/package.json').version")
            fi
          fi
          echo "QUERYEER_RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Generate release changelog
        run: node queryeer-desktop/packages/app/scripts/generate-changelog.mjs

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Queryeer ${{ env.QUERYEER_RELEASE_VERSION }}
          body_path: queryeer-desktop/packages/app/dist/generated/CHANGELOG.md
          draft: false
          prerelease: false
          files: release-artifacts/*

      - name: Dry-run release summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          echo "Dry-run release workflow completed for version ${QUERYEER_RELEASE_VERSION}."
          echo "Skipped Maven Central publish, npm publish, and GitHub release creation."
