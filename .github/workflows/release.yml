name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  backend-verify:
    name: Backend Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: zulu
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./queryeer-backend/mvnw

      - name: Run backend clean verify
        run: ./queryeer-backend/mvnw -f queryeer-backend/pom.xml clean verify

  build:
    name: Build ${{ matrix.name }} Distribution
    runs-on: ${{ matrix.os }}
    needs: backend-verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact-name: queryeer-windows
          - name: macOS
            os: macos-latest
            artifact-name: queryeer-macos
          - name: Linux
            os: ubuntu-latest
            artifact-name: queryeer-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version
        shell: bash
        run: echo "QUERYEER_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: queryeer-desktop/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: zulu
          cache: maven

      - name: Make Maven wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./queryeer-backend/mvnw

      - name: Install desktop dependencies
        working-directory: queryeer-desktop
        run: npm ci

      - name: Run desktop typecheck
        working-directory: queryeer-desktop
        run: npm run typecheck

      - name: Run desktop lint
        working-directory: queryeer-desktop
        run: npm run lint

      - name: Run desktop tests
        working-directory: queryeer-desktop
        run: npm run test

      - name: Build distribution
        working-directory: queryeer-desktop
        run: npm run dist:release

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            queryeer-desktop/release/*.exe
            queryeer-desktop/release/*.dmg
            queryeer-desktop/release/*.AppImage
            !queryeer-desktop/release/*-unpacked/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version
        run: echo "QUERYEER_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate release changelog
        run: node queryeer-desktop/scripts/generate-changelog.mjs

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Queryeer ${{ env.QUERYEER_RELEASE_VERSION }}
          body_path: queryeer-desktop/dist/generated/CHANGELOG.md
          draft: false
          prerelease: false
          files: release-artifacts/*
