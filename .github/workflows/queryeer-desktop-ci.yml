name: Queryeer Desktop CI

on:
  push:
    branches:
      - "**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop-validation:
    name: Desktop Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queryeer-desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: queryeer-desktop/package-lock.json

      - name: Setup Electron (cache)
        uses: ./.github/actions/setup-electron
        with:
          mode: cache

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ${{ github.workspace }}/queryeer-backend/mvnw

      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Electron (ensure)
        uses: ./.github/actions/setup-electron
        with:
          mode: ensure

      - name: Run desktop unit tests
        run: npm run test

      - name: Run desktop typecheck
        run: npm run typecheck

      - name: Run desktop lint
        run: npm run lint

      - name: Run desktop build
        run: npm run build

  backend-validation:
    name: Backend Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./queryeer-backend/mvnw

      - name: Run backend clean verify
        run: ./queryeer-backend/mvnw -f queryeer-backend/pom.xml clean verify


