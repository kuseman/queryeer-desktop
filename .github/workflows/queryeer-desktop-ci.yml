name: Queryeer Desktop CI

on:
  push:
    branches:
      - "**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop-validation:
    name: Desktop Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queryeer-desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: queryeer-desktop/package-lock.json

      - name: Get Electron version
        id: electron-cache
        run: echo "version=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.electron
          key: ${{ runner.os }}-electron-${{ steps.electron-cache.outputs.version }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"
          cache: maven

      - name: Install desktop dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run desktop unit tests
        run: npm run test

      - name: Run desktop typecheck
        run: npm run typecheck

      - name: Run desktop lint
        run: npm run lint

      - name: Run desktop build
        run: npm run build

  backend-validation:
    name: Backend Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./queryeer-backend/mvnw

      - name: Run backend clean verify
        run: ./queryeer-backend/mvnw -f queryeer-backend/pom.xml clean verify

  integration-validation:
    name: Desktop Integration Tests
    runs-on: ubuntu-latest
    needs: desktop-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: queryeer-desktop/package-lock.json

      - name: Get Electron version
        id: electron-cache
        run: echo "version=$(node -p "require('./queryeer-desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.electron
          key: ${{ runner.os }}-electron-${{ steps.electron-cache.outputs.version }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./queryeer-backend/mvnw

      - name: Install desktop dependencies
        run: |
          cd ./queryeer-desktop
          npm ci --prefer-offline --no-audit --no-fund

      - name: Run integration tests
        run: |
          cd ./queryeer-desktop
          npm run test:integration
